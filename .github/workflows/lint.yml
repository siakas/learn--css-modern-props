name: Lint Check

# 1. いつ実行するか: Pull Request が作成・更新されたとき
on:
  pull_request:

jobs:
  lint:
    name: Run Biome
    runs-on: ubuntu-latest # 2. どの環境で: 最新の Ubuntu (Linux) 環境で実行

    steps:
      # リポジトリのコードをチェックアウト（取得）する
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm をセットアップする
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node.js をセットアップする
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Volta で指定しているバージョン
          cache: 'pnpm' # 依存関係のインストールを高速化するためのキャッシュ設定

      # 依存パッケージをインストールする
      - name: Install dependencies
        run: pnpm install

      # 3. 何をするか: Biome で lint とフォーマットをチェック
      - name: Run Biome Check
        run: pnpm biome ci .
